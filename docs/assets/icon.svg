<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <!-- A terminal window with a shell prompt: the plugin mounts a remote
       directory as a workspace, which you drive from a shell. A local gradient
       gives the glass depth that survives the 30px row size; all references are
       self-contained so the image decodes without a document. -->
  <defs>
    <linearGradient id="sshwsp-terminal-glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7ba7ff"/>
      <stop offset="0.5" stop-color="#4a6cf7"/>
      <stop offset="1" stop-color="#2b3f96"/>
    </linearGradient>
  </defs>
  <rect x="4.5" y="7.5" width="27" height="21" rx="3.6" fill="url(#sshwsp-terminal-glass)"/>
  <path d="M4.5 13.4h27" stroke="#fff" stroke-opacity="0.28" stroke-width="0.9"/>
  <circle cx="8.8" cy="10.4" r="1" fill="#fff" fill-opacity="0.9"/>
  <circle cx="12.4" cy="10.4" r="1" fill="#fff" fill-opacity="0.55"/>
  <circle cx="16" cy="10.4" r="1" fill="#fff" fill-opacity="0.3"/>
  <path d="M11.2 18.6l4.4 3.6-4.4 3.6" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 25.8h5" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
</svg>
